# Pixano in local mode — the job execution foundation (step 1).
#
# This file describes ONE wiring of the architecture, not the architecture. Every link between
# components is an address + a secret, never a colocation assumption: in a shared deployment
# (common database and storage, inference on a properly sized server) as in the cloud, only the
# values of .env change — no service described here is rewritten.
#
#   docker compose up
#       the inference is a server already in place, designated by PIXANO_INFERENCE_URL.
#
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up
#       + an inference built locally (CPU variant, without GPU or torch).

services:
  postgres:
    image: postgres:16
    # Bound to localhost: the database is never exposed outside the machine by default.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  pixano:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.source
    ports:
      - "127.0.0.1:${PIXANO_PORT:-7492}:7492"
    environment:
      PIXANO_INFERENCE_URL: ${PIXANO_INFERENCE_URL:?set PIXANO_INFERENCE_URL (see .env.example)}
      # The app drops the jobs into the same queue the worker consumes.
      PIXANO_DATABASE_URL: ${PIXANO_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      # Root under which Pixano sees the media reachable by path. The storage mounted here
      # is one case; a dataset may also live in object storage, or stay on its owner's
      # machine (see lot 8, media resolver).
      PIXANO_MEDIA_ROOT: ${PIXANO_MEDIA_ROOT:-/medias}
      # Sans elle, seule l'interface legacy est servie (voir .env.example).
      ACTIVATE_UI_V1_0: ${ACTIVATE_UI_V1_0:-false}
    command:
      - sh
      - -c
      - pixano init /data && pixano server run /data --host 0.0.0.0 --port 7492
        --pixano-inference-url "$$PIXANO_INFERENCE_URL"
    volumes:
      # /data is the image's internal convention; the media root, on the other hand, must
      # follow the variable, since it is what the worker hands to the inference.
      - ${PIXANO_DATA_DIR:-./data}:/data
      - ${PIXANO_MEDIA_DIR:-./data/media}:${PIXANO_MEDIA_ROOT:-/medias}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:7492/health", timeout=4)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pixano-worker:
    build:
      # The repository root, because the worker depends on pixano's source by path.
      context: .
      dockerfile: packages/pixano-worker/Dockerfile
    # Always restarted, unless a stop was requested (`stop`, `down`). A worker that exits in
    # error — an incompatible schema, a defect that persists — therefore comes back in a loop,
    # and its message with it at every turn: this is intended, the lot 1 decision was "refuse
    # to start with a clear message", not "stay down for good". `on-failure:N` never resets its
    # counter (verified): the N-th incident of a long life left the worker on the ground.
    # Transient database outages, for their part, are absorbed without restarting.
    # Verified: a `docker compose kill` counts as a requested stop and is not restarted — the
    # demo, which kills the worker and then relaunches it by hand, relies on it; a process
    # that exits on its own, whatever its code, is relaunched.
    restart: unless-stopped
    # Above the 30 s the worker leaves its in-flight chunks to finish (SHUTDOWN_GRACE_S):
    # without this margin, docker would kill it before it had returned the ones not finished.
    stop_grace_period: 45s
    environment:
      PIXANO_DATABASE_URL: ${PIXANO_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      PIXANO_INFERENCE_URL: ${PIXANO_INFERENCE_URL:?set PIXANO_INFERENCE_URL (see .env.example)}
      PIXANO_INFERENCE_API_KEY: ${PIXANO_INFERENCE_API_KEY:-}
      PIXANO_LIBRARY_DIR: ${PIXANO_LIBRARY_DIR:-/data/library}
      # When the worker and the inference see the same storage, the worker translates its
      # paths to the inference's view before each call — here the two roots coincide,
      # elsewhere they do not. The other cases (object storage, media left with the user)
      # are other strategies of the resolver, not other values of these two variables.
      PIXANO_MEDIA_ROOT: ${PIXANO_MEDIA_ROOT:-/medias}
      PIXANO_INFERENCE_MEDIA_ROOT: ${PIXANO_INFERENCE_MEDIA_ROOT:-/medias}
      PIXANO_WORKER_CONCURRENCY: ${PIXANO_WORKER_CONCURRENCY:-4}
      PIXANO_WORKER_CHUNK_TIMEOUT_S: ${PIXANO_WORKER_CHUNK_TIMEOUT_S:-1800}
      # Off unless the .env says so: .env.example turns them on for the local demo, and a
      # shared deployment that starts from this file without it does not inherit them.
      PIXANO_WORKER_DEMO_KINDS: ${PIXANO_WORKER_DEMO_KINDS:-false}
    volumes:
      # /data is the image's internal convention; the media root, on the other hand, must
      # follow the variable, since it is what the worker hands to the inference.
      - ${PIXANO_DATA_DIR:-./data}:/data
      - ${PIXANO_MEDIA_DIR:-./data/media}:${PIXANO_MEDIA_ROOT:-/medias}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "pixano_worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
