# Overlay: an inference built and run on this machine.
#
# For local mode only. In the lab and in the cloud, pixano-inference is a separate
# deployment with its own GPU capacity: drop this overlay and simply point
# PIXANO_INFERENCE_URL at it.
#
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up
#
# The variant built is the CPU variant (torch CPU) with the CLIP embeddings, YOLO detection
# and SAM 2.1 segmentation plugins: it serves real embeddings, real boxes and real masks
# without a GPU, fast enough for a demonstration. For real capacity, switch the build args to
# GPU (see below) and mount your own model list in place of docker/inference/models.cpu.py.
#
# The image is the one pixano-inference's own Dockerfile produces, from an UNMODIFIED
# checkout of it (PIXANO_INFERENCE_REPO) at v0.7.1, the release Pixano's client requires. Its
# build args choose the plugins: MODEL_PACKAGES installs the SAM 2.1 and CLIP packages of
# that tree, EXTRA_PACKAGES its YOLO example. Nothing of ours is added to the image.
#
# The build fetches sam-2 from GitHub, and the first start fetches the SAM weights from
# huggingface.co into the weights volume (HF_HOME, /data/hf): both need the network once.
#
# No tracking model is served: the four models of docker/inference/models.cpu.py already
# reserve 8 CPUs, all a machine of 8 cores gives Docker. Tracking by detection, in the legacy
# video workspace, needs another inference server that serves one, or two more CPUs here and
# the YOLO plugin's YOLOByteTrackModel added to the model list.

services:
  pixano-inference:
    build:
      context: ${PIXANO_INFERENCE_REPO:-../pixano-inference}
      dockerfile: Dockerfile
      args:
        # CPU variant: torch CPU. GPU variant: remove this line (the Dockerfile's default is a
        # CUDA build).
        TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
        # The plugins docker/inference/models.cpu.py serves, in place of the Dockerfile's default
        # set (SAM, Grounding DINO, a VLM). Without one of them, the server refuses the whole
        # model list ("Unknown model_class 'Sam2ImageModel'"), every model included.
        MODEL_PACKAGES: "pixano-inference-sam pixano-inference-clip"
        # The YOLO detector, an example plugin of the same tree, given by its path in the build
        # context. The plugin leaves Ultralytics unpinned; the version pinned here is the one
        # this image was verified with, so that a rebuild serves the same detector.
        # Ultralytics is AGPL-3.0: serving it over a network carries source-disclosure
        # obligations (AGPL section 13). It is here to make a demonstration run on a laptop;
        # a deployment picks its own detector, and nothing in Pixano names this one.
        EXTRA_PACKAGES: "./examples/yolo ultralytics==8.4.160"
    ports:
      - "127.0.0.1:${PIXANO_INFERENCE_PORT:-7463}:7463"
    environment:
      # Without a key, every route is open — acceptable on one machine, never as soon as
      # the inference is shared. The variable passes through from now on so that there is
      # nothing to wire up the day it becomes mandatory.
      PIXANO_INFERENCE_API_KEYS: ${PIXANO_INFERENCE_API_KEYS:-}
      # Root under which the inference accepts media by path. It is the counterpart of
      # PIXANO_INFERENCE_MEDIA_ROOT on the worker side: pixels never go through Pixano.
      PIXANO_INFERENCE_MEDIA_ROOTS: ${PIXANO_INFERENCE_MEDIA_ROOT:-/medias}
      HF_TOKEN: ${HF_TOKEN:-}
      # Ultralytics keeps its settings in the home directory by default; the volume keeps
      # them, next to the weights, across restarts.
      YOLO_CONFIG_DIR: /data/ultralytics
    volumes:
      - pixano-inference-weights:/data
      - ./docker/inference/models.cpu.py:/config/models.py:ro
      - ${PIXANO_MEDIA_DIR:-./data/media}:${PIXANO_INFERENCE_MEDIA_ROOT:-/medias}:ro
    command:
      ["--host", "0.0.0.0", "--port", "7463", "--config", "/config/models.py"]
    # Ray leaves child processes behind it; Python is not an init.
    init: true
    # Ray's object store lives in /dev/shm, whose 64 MB default is too small.
    shm_size: "8gb"
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7463/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # GPU variant: uncomment, and remove the TORCH_INDEX_URL build arg above.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pixano:
    depends_on:
      pixano-inference:
        condition: service_healthy

  pixano-worker:
    depends_on:
      pixano-inference:
        condition: service_healthy

volumes:
  pixano-inference-weights:
