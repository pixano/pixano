# Overlay: an inference built and run on this machine.
#
# For local mode only. In the lab and in the cloud, pixano-inference is a separate
# deployment with its own GPU capacity: drop this overlay and simply point
# PIXANO_INFERENCE_URL at it.
#
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up
#
# The variant built is the CPU variant (torch CPU) with the CLIP embeddings plugin: it
# serves real embeddings without a GPU, fast enough for a demonstration. For real capacity,
# switch the build args to GPU (see below) and mount your own model list in place of
# docker/inference/models.cpu.py.
#
# The image is built in two stages, from an UNMODIFIED clone of pixano-inference
# (PIXANO_INFERENCE_REPO): first the image its own Dockerfile produces, then a layer
# defined here, dockerfiles/Dockerfile.inference-clip, which installs the CLIP plugin in it.
# The plugin is in their repository, but their Dockerfile has no switch to install it;
# to be proposed to them, and this layer will disappear with it.
#
# The "no framework" variant (empty TORCH_INDEX_URL) does not start: Ray Serve imports
# jinja2 in its haproxy module without declaring it in ray[serve], and it is torch that
# brings it in incidentally. To be reported to the pixano-inference repository.

services:
  # Never runs: this service only exists so that its build serves as the base for that of
  # pixano-inference. Zero instances, rather than a profile: a service set aside by a
  # profile no longer exists for the others, and so cannot serve as their context.
  pixano-inference-base:
    scale: 0
    build:
      context: ${PIXANO_INFERENCE_REPO:-../pixano-inference}
      dockerfile: Dockerfile
      args:
        # CPU variant: torch CPU, no SAM2.
        # GPU variant: remove these three lines (the Dockerfile's defaults are GPU+SAM).
        TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
        PIXANO_EXTRAS: ""
        INSTALL_SAM: "false"

  pixano-inference:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.inference-clip
      additional_contexts:
        inference-base: "service:pixano-inference-base"
        inference-src: ${PIXANO_INFERENCE_REPO:-../pixano-inference}
    ports:
      - "127.0.0.1:${PIXANO_INFERENCE_PORT:-7463}:7463"
    environment:
      # Without a key, every route is open — acceptable on one machine, never as soon as
      # the inference is shared. The variable passes through from now on so that there is
      # nothing to wire up the day it becomes mandatory.
      PIXANO_INFERENCE_API_KEYS: ${PIXANO_INFERENCE_API_KEYS:-}
      # Root under which the inference accepts media by path. It is the counterpart of
      # PIXANO_INFERENCE_MEDIA_ROOT on the worker side: pixels never go through Pixano.
      PIXANO_INFERENCE_MEDIA_ROOTS: ${PIXANO_INFERENCE_MEDIA_ROOT:-/medias}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - pixano-inference-weights:/data
      - ./docker/inference/models.cpu.py:/config/models.py:ro
      - ${PIXANO_MEDIA_DIR:-./data/media}:${PIXANO_INFERENCE_MEDIA_ROOT:-/medias}:ro
    command:
      ["--host", "0.0.0.0", "--port", "7463", "--config", "/config/models.py"]
    # Ray leaves child processes behind it; Python is not an init.
    init: true
    # Ray's object store lives in /dev/shm, whose 64 MB default is too small.
    shm_size: "8gb"
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7463/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # GPU variant: uncomment and set the build args back to the Dockerfile's defaults.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pixano:
    depends_on:
      pixano-inference:
        condition: service_healthy

  pixano-worker:
    depends_on:
      pixano-inference:
        condition: service_healthy

volumes:
  pixano-inference-weights:
