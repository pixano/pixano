[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixano-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The pool gives each chunk in flight a connection of its own: an asynchronous connection
    # serves one query at a time, and the worker runs several chunks at once.
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
    # The contract of a job kind's parameters, and the JSON schema published from it.
    "pydantic>=2.9,<3.0",
    # The schemas and the access to datasets. Measured before deciding: the dataset layer is
    # 600 MB of pixano's 647 MB, because the weight is in polars, opencv, pyarrow and lancedb,
    # which the worker needs whatever happens. A shared package would have saved 7 %. See
    # docs/specs/backend-processing.md §7.
    "pixano",
]

[tool.uv.sources]
# Editable, and not as a convenience: a non-editable install builds pixano's wheel, whose build
# hook compiles the frontend. Installing the worker would then require pnpm and node, which makes
# no sense for a service that serves no page.
pixano = { path = "../..", editable = true }

[project.scripts]
pixano-worker = "pixano_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_worker"]

[dependency-groups]
test = ["pytest", "pytest-asyncio"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# As in the application's suite: a test coroutine runs without a decorator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test stuck this long dumps every thread's stack, so that a hang says where it is.
faulthandler_timeout = 120
