name: Frontend

on:
  push:
    paths:
      - "ui/**"
      - ".github/workflows/frontend.yml"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
    branches:
      - "main"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/frontend.yml"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
    branches:
      - "main"
      - "arch/**"
      - "feat/**"
      - "releases/**"

permissions:
  contents: read

jobs:
  lint_front:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Install dependencies
        run: |
          cd ui
          pnpm i --frozen-lockfile
      # `turbo lint` only runs workspaces that define a `lint` script, so this
      # currently covers apps/pixano alone. Adding one to apps/web would pin the
      # job red (134 eslint errors, mostly no-unsafe-call / unbound-method in
      # test files); add it once those are cleared.
      - name: Lint frontend code with eslint
        run: |
          cd ui
          pnpm lint
  format_front:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: |
          cd ui
          pnpm i --frozen-lockfile

      - name: Format frontend code with Prettier
        run: |
          cd ui
          pnpm format_check
  check_front:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: |
          cd ui
          pnpm i --frozen-lockfile

      # Deliberately scoped to apps/pixano, not `pnpm check` (turbo, all
      # workspaces): apps/web currently reports 41 svelte-check errors, so
      # widening this would pin the job red. Widen it once those are cleared —
      # apps/web is already covered by Test and Build above.
      - name: Type-check frontend code with svelte-check
        run: |
          cd ui
          pnpm -C apps/pixano run check
  test_front:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: |
          cd ui
          pnpm i --frozen-lockfile

      # Turbo runs every workspace's `test` script, so this covers apps/web too.
      - name: Test frontend code with vitest
        run: |
          cd ui
          pnpm test
  build_front:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: |
          cd ui
          pnpm i --frozen-lockfile

      # Turbo runs every workspace's `build` script, so this covers apps/web too.
      - name: Build frontend
        run: |
          cd ui
          pnpm build
