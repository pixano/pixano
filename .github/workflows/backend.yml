name: Backend

on:
  push:
    paths:
      - "src/pixano/**"
      - "tests/**"
      - "packages/**"
      - ".github/workflows/backend.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "release/**"

permissions:
  contents: read

jobs:
  pre-commit:
    name: Lint and format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv tool run pre-commit run --all-files

      - name: Format top-level Markdown and YAML files with Prettier
        uses: creyD/prettier_action@v4.3
        with:
          dry: True
          prettier_options: --check ./*.{md,yml}
          # Prettier 3.0 not yet available in VSCode extension
          prettier_version: 2.8.8

      - name: Format GitHub actions YAML files with Prettier
        uses: creyD/prettier_action@v4.3
        with:
          dry: True
          prettier_options: --check ./.github/workflows/*.yml
          # Prettier 3.0 not yet available in VSCode extension
          prettier_version: 2.8.8

      - name: Format backend Markdown files with Prettier
        uses: creyD/prettier_action@v4.3
        with:
          dry: True
          prettier_options: --check ./src/pixano/**/*.md
          # Prettier 3.0 not yet available in VSCode extension
          prettier_version: 2.8.8
  pytest:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      # L'application est cliente de la file de jobs : ses tests de mise en file ont besoin
      # d'un vrai PostgreSQL, sans quoi ils sauteraient en silence.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pixano
          POSTGRES_PASSWORD: pixano
          POSTGRES_DB: pixano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          uv sync --group test

      # Le worker possède le schéma : l'application ne le crée jamais, pas même en test.
      # Cette étape reproduit l'ordre réel — le worker installe, l'application consomme.
      - name: Install the job schema with pixano-worker
        env:
          PIXANO_DATABASE_URL: postgresql://pixano:pixano@localhost:5432/pixano_test
        run: >-
          uv run --directory packages/pixano-worker python -c "import os, psycopg;
          from pixano_worker.schema import ensure_schema;
          ensure_schema(psycopg.connect(os.environ['PIXANO_DATABASE_URL']))"

      - name: Test with pytest
        env:
          PIXANO_TEST_DATABASE_URL: postgresql://pixano:pixano@localhost:5432/pixano_test
        run: uv run pytest --cov=src/pixano/ -m "not slow and not hub" tests/
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  worker:
    name: Worker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le paquet exige Python 3.11 ; la matrice ci-dessus descend à 3.10.
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pixano
          POSTGRES_PASSWORD: pixano
          POSTGRES_DB: pixano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with pytest
        # Variable dédiée : les tests ne doivent jamais pouvoir viser la base d'un
        # déploiement, fût-il local.
        env:
          PIXANO_TEST_DATABASE_URL: postgresql://pixano:pixano@localhost:5432/pixano_test
        run: uv run --directory packages/pixano-worker pytest

  # Same steps as the Publish workflow, so that a packaging failure shows up on the pull
  # request instead of on release day.
  wheel:
    name: Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js 23
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Setup pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Build package
        run: uv build

      - name: Verify clean wheel installation and startup
        run: |
          python -m venv "$RUNNER_TEMP/pixano-wheel-smoke"
          "$RUNNER_TEMP/pixano-wheel-smoke/bin/python" -m pip --isolated install --index-url https://pypi.org/simple dist/pixano-*.whl
          "$RUNNER_TEMP/pixano-wheel-smoke/bin/python" .github/scripts/smoke_wheel.py --expected-version "$(cat VERSION)"

  # The one check that branch protection requires for this workflow. List every job above in
  # `needs`. It runs even when one of them fails, because a skipped job would count as a pass.
  result:
    name: Backend
    if: always()
    needs: [pre-commit, pytest, worker, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
