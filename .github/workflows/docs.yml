name: Documentation

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "docs-astro/**"
      - "src/pixano/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

# Builds without publishing. The Publish workflow deploys the site when a release is published.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Named after the workflow: this is the check that branch protection requires.
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Version comes from "packageManager" in docs-astro/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-astro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-astro/pnpm-lock.yaml

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --group docs

      - name: Install Node dependencies
        run: pnpm i --frozen-lockfile
        working-directory: docs-astro

      - name: Generate API reference
        run: uv run python docs-astro/scripts/generate_api_docs.py

      - name: Build Astro site
        run: pnpm exec astro build
        working-directory: docs-astro

      - name: Run Pagefind
        run: pnpm exec pagefind --site dist
        working-directory: docs-astro
