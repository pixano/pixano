name: Docker

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "dockerfiles/**"
      - ".dockerignore"
      - "LICENSE"
      - "src/pixano/**"
      - "ui/**"
      - "packages/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "hatch_build.py"
      - "uv.lock"
  pull_request:
    branches:
      - "main"
      - "release/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.source
          load: true
          tags: pixano/pixano:test

      - name: Test container
        run: |
          docker run -p 7492:7492 --name pixano -d pixano/pixano:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7492/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              docker logs pixano
              docker rm -f pixano
              exit 1
            fi
            sleep 1
          done
          RESPONSE=$(curl -sf http://localhost:7492/health)
          echo "Health check response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'
          echo "Test passed"
          docker rm -f pixano

  worker:
    name: Worker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The context is the repository root: the worker depends on pixano's source by path, and
      # a context limited to the package does not see it. That is exactly what had broken the
      # image without anything reporting it, for want of a build in continuous integration.
      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/pixano-worker/Dockerfile
          load: true
          tags: pixano/pixano-worker:test

      # Loading the registry exercises the whole import chain, including the system libraries
      # opencv needs once pixano.schemas pulls it in. An image that starts but cannot load any
      # job kind is broken without saying so.
      - name: The job kinds load
        run: |
          docker run --rm pixano/pixano-worker:test python -c "
          from pixano_worker.kinds import default_registry
          names = default_registry(demo_kinds=True).names()
          print('kinds:', names)
          assert names, 'no job kind could be loaded'
          "

      # Without configuration, the worker must refuse to start and say so, rather than loop or
      # connect anywhere at random.
      - name: An unconfigured worker refuses to start
        run: |
          set +e
          output=$(docker run --rm pixano/pixano-worker:test 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "PIXANO_DATABASE_URL"

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The compose files interpolate variables and require some of them: a mistake there
      # shows at the first `up`, that is, too late.
      - name: The compose files resolve
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.inference.yml config --quiet

  # The one check that branch protection requires for this workflow. List every job above in
  # `needs`. It runs even when one of them fails, because a skipped job would count as a pass.
  result:
    name: Docker
    if: always()
    needs: [test, worker, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
